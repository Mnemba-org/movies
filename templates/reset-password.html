<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div style="max-width: 400px; margin: 100px auto; padding: 20px;">
        <h2>Create New Password</h2>
        <form id="resetForm">
            <input type="password" id="password" placeholder="New password" required>
            <input type="password" id="confirm" placeholder="Confirm password" required>
            <button type="submit">Reset Password</button>
        </form>
        <div id="message"></div>
    </div>

    <script>
        const supabaseClient = supabase.createClient(
            'https://pdtxywmysjvgkyhrfoyq.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkdHh5d215c2p2Z2t5aHJmb3lxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3MjIzOTIsImV4cCI6MjA5MDI5ODM5Mn0.hDv9LlpR-oaooyU2SlOxRoT8T07yVwO8nRe0W6PkuaE'
        );
        
        document.getElementById('resetForm').onsubmit = async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm').value;
            const messageDiv = document.getElementById('message');
            
            if (password !== confirm) {
                messageDiv.style.color = 'red';
                messageDiv.textContent = 'Passwords do not match';
                return;
            }
            
            const { error } = await supabaseClient.auth.updateUser({ password: password });
            
            if (error) {
                messageDiv.style.color = 'red';
                messageDiv.textContent = error.message;
            } else {
                messageDiv.style.color = 'green';
                messageDiv.innerHTML = 'Success! <a href="/login">Login here</a>';
            }
        };
    </script>
</body>
</html>
