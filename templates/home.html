<div class="series-grid">
    {% for content in mixed_content %}
    <div class="movie-card-small">
        <div class="movie-thumb">
            {% if content.type == 'video' %}
                <a href="{{ url_for('movie', video_id=content.item.id) }}">
                    <img src="{{ content.item.thumbnail }}" alt="{{ content.item.title }}">
                </a>
            {% else %}
                <a href="{{ url_for('series', series_id=content.item.id) }}">
                    <img src="{{ content.item.thumbnail }}" alt="{{ content.item.title }}">
                </a>
            {% endif %}
        </div>
        <div class="movie-info-small">
            <h5 class="movie-title-small">{{ content.item.title }}</h5>
            <div class="movie-meta-small">
                <!-- Shows "Video" or "Series" badge -->
                <span class="type-badge">{{ content.type | capitalize }}</span> 

                {% if content.item.free %}
                    <span class="badge-free-small">Free</span>
                {% else %}
                    <span class="badge-premium-small">Premium</span>
                {% endif %}
            </div>
        </div>
    </div>
    {% endfor %}
</div>
