{% for item in all_items_sorted %}
<div class="movie-card-small">
    <div class="movie-thumb">
        {% if item.thumbnail %}
        <a href="{{ url_for(item.type, id=item.id) }}">
            <img src="{{ item.thumbnail }}" alt="{{ item.title }}">
        </a>
        {% else %}
        <img src="https://via.placeholder.com/300x450?text=No+Thumbnail" alt="No thumbnail">
        {% endif %}
    </div>
    <div class="movie-info-small">
        <h5 class="movie-title-small">{{ item.title }}</h5>
        <div class="movie-meta-small">
            {% if item.free %}
            <span class="badge-free-small">Free</span>
            {% else %}
            <span class="badge-premium-small">Premium</span>
            {% endif %}
            {% if item.episodes %}
            <span style="color: #3498db;">{{ item.episodes|length }} episodes</span>
            {% endif %}
        </div>
    </div>
</div>
{% endfor %}
