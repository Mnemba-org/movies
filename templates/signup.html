<!DOCTYPE html>
<html>
<head>
    <title>Sign Up</title>

    <!-- Mobile responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        body {
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #111;
            color: white;
        }

        form {
            width: 90%;
            max-width: 400px;
        }

        input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            margin-bottom: 10px;
        }

        button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            background: #ffd700;
            border: none;
            cursor: pointer;
        }

        a {
            color: #ffd700;
        }
    </style>
</head>

<body>
    <form method="POST" action="/signup">
        <h2>Create Account</h2>

        <input type="text" name="username" placeholder="Username" required>

        <input type="email" name="email" placeholder="Email" required>

        <!-- PASSWORD -->
        <div style="position: relative;">
            <input type="password" id="password" name="password" placeholder="Password" required>
            <span onclick="togglePassword('password')" style="position:absolute; right:10px; top:12px; cursor:pointer;">👁️</span>
        </div>

        <!-- CONFIRM PASSWORD -->
        <div style="position: relative;">
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm Password" required>
            <span onclick="togglePassword('confirm_password')" style="position:absolute; right:10px; top:12px; cursor:pointer;">👁️</span>
        </div>

        <br>

        <button type="submit">Sign Up</button>

        <br><br>

        <a href="{{ url_for('login') }}">Already have an account? Login</a>

        {% if error %}
            <p id="error_message" style="color:red;">{{ error }}</p>
        {% endif %}
    </form>

    <script>
        function togglePassword(id) {
            var input = document.getElementById(id);
            input.type = (input.type === "password") ? "text" : "password";
        }

        setTimeout(function() {
            var error = document.getElementById("error_message");
            if (error) error.style.display = "none";
        }, 3000);
    </script>
</body>
</html>
