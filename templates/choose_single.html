{% extends "layout.html" %}

{% block title %}
<title>Swahili Movie Hub · Home</title>
{% endblock %}

{% block content %}
   <!-- Movies Section -->
    <h2 style="color: #fff; margin: 40px 0 20px; font-size: 1.8rem; border-left: 5px solid #e50914; padding-left: 15px;">MOVIES</h2>
    
    <div class="series-grid">
        {% if videos %}
            {% for video in videos %}
            <div class="movie-card-small">
                <div class="movie-thumb">
                    <a href="{{ url_for('movie', video_id=video.id) }}">
                        <img src="{{ video.thumbnail }}" alt="{{ video.title }}">
                    </a>
                </div>
                <div class="movie-info-small">
                    <h5 class="movie-title-small">{{ video.title }}</h5>
                    <div class="movie-meta-small">
                        {% if video.free %}
                        <span class="badge-free-small">Free</span>
                        {% else %}
                        <span class="badge-premium-small">Premium</span>
                        {% endif %}
                    </div>
                </div>
            </div>
            {% endfor %}
        {% else %}
            <div class="text-center p-5" style="grid-column: 1/-1; background: rgba(255,255,255,0.1); border-radius: 12px; padding: 50px;">
                <i class="bi bi-film" style="font-size: 3rem; color: white;"></i>
                <h4 class="mt-3 text-white">No Movies Found</h4>
            </div>
        {% endif %}
    </div>



<!-- Simple styling for the button with unique class -->
<style>
    .my-search-button {
        background-color: #e50914;
        color: white;
        border: none;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
    }
</style>
{% endblock %}
