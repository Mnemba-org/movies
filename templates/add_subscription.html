<h2>Add Subscription</h2>
{%with messages = get_flashed_messages() %}
    {% if messages %}
        <div class="alert alert-info">
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        </div>
    {% endif %}
{% endwith %}
<form method="POST">
    <input type="email" name="email" placeholder="User Email" required>

    <select name="plan">
        <option value="weekly">Weekly (2000 TSh)</option>
        <option value="monthly">Monthly (4000 TSh)</option>
    </select>

    <button type="submit">Add Subscription</button>
</form>

<br>

<a href="{{ url_for('subscribers') }}">View All Subscribers</a>
